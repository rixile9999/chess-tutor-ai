<title>오프닝 지도 M8d 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root {
  --paper: #f4efe6; --surface: #fcf9f3; --surface-2: #f1ebdf;
  --ink: #2b2622; --ink-2: #6b6259; --ink-3: #9b9187;
  --line: #e4dbcb; --line-strong: #cdc1ab;
  --good: #2478a6; --good-bg: rgba(36,120,166,.10);
  --bad: #c25a3c; --bad-bg: rgba(194,90,60,.12);
  --warn: #a8731c; --warn-bg: rgba(168,115,28,.12);
  --board-light: #ecdfc5; --board-dark: #a98b68; --last: rgba(168,115,28,.30);
  --note: #6a3fb5; --note-bg: rgba(106,63,181,.12);
  --font-ui: 'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --font-display: 'Gowun Batang','Apple Myungjo','Noto Serif KR',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1e1b18; --surface: #27231f; --surface-2: #2f2a25; --ink: #ece5d8; --ink-2: #b3a898; --ink-3: #7d746a;
    --line: #3a342e; --line-strong: #4d453c; --good: #5aa0cc; --good-bg: rgba(90,160,204,.16); --bad: #d97a5c; --bad-bg: rgba(217,122,92,.16);
    --warn: #d1a04a; --warn-bg: rgba(209,160,74,.16); --board-light: #b9a583; --board-dark: #7a5f45; --last: rgba(209,160,74,.32);
    --note: #b596ea; --note-bg: rgba(181,150,234,.16);
  }
}
:root[data-theme="dark"] {
  --paper: #1e1b18; --surface: #27231f; --surface-2: #2f2a25; --ink: #ece5d8; --ink-2: #b3a898; --ink-3: #7d746a;
  --line: #3a342e; --line-strong: #4d453c; --good: #5aa0cc; --good-bg: rgba(90,160,204,.16); --bad: #d97a5c; --bad-bg: rgba(217,122,92,.16);
  --warn: #d1a04a; --warn-bg: rgba(209,160,74,.16); --board-light: #b9a583; --board-dark: #7a5f45; --last: rgba(209,160,74,.32);
  --note: #b596ea; --note-bg: rgba(181,150,234,.16);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mv { font-family: var(--font-mono); font-weight: 500; }
.small { font-size: 12px; } .muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.page { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; padding-inline: 20px; display: flex; flex-direction: column; gap: 14px; }
.intro { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border: 1px dashed var(--note); border-radius: 8px; background: var(--note-bg); }
.intro b { color: var(--note); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .n { font-family: var(--font-mono); font-size: 11px; opacity: .8; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.title { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.h3 { font-weight: 600; font-size: 15px; }
.grow { flex: 1; }
.explore { display: grid; grid-template-columns: minmax(280px, 400px) minmax(360px, 1fr); gap: 18px 24px; align-items: start; }
.board-col { display: flex; flex-direction: column; gap: 10px; }
.board-wrap { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1; }
.board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); width: 100%; height: 100%; border-radius: 4px; overflow: hidden; user-select: none; }
.sq { position: relative; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 4.6vw, 34px); line-height: 1; }
.sq.l { background: var(--board-light); } .sq.d { background: var(--board-dark); }
.sq.last { background-image: linear-gradient(var(--last), var(--last)); }
.sq .p { font-family: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', sans-serif; }
.sq .p.w { color: #fffdf7; text-shadow: 0 0 2px #3a2f24, 0 0 1px #3a2f24, 0 1px 1px #3a2f24; } .sq .p.b { color: #2a221c; }
.preview-chip { position: absolute; top: 8px; left: 8px; z-index: 2; background: var(--ink); color: var(--paper); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.board-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 26px; }
.btn { height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: 12px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.sm { height: 24px; font-size: 11px; padding: 0 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge.good { background: var(--good-bg); color: var(--good); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.badge.dashed { border: 1px dashed var(--line-strong); background: none; color: var(--ink-2); }
.badge.note { background: var(--note-bg); color: var(--note); }
.req { position: absolute; top: -9px; right: 10px; z-index: 3; background: var(--note); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }

/* explain panel */
.explain { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.explain-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.explain-head .lab { font-size: 22px; font-family: var(--font-display); font-weight: 700; }
.explain-head .lab .mv { font-size: 20px; }
.summary { font-size: 15px; line-height: 1.65; max-width: 62ch; position: relative; }
.v { border-bottom: 1px dotted var(--good); }
.v::after { content: "✓"; font-size: 10px; color: var(--good); margin-left: 2px; vertical-align: super; }
.sec { border-top: 1px solid var(--line); }
.sec summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 0; cursor: pointer; font-weight: 600; }
.sec summary::-webkit-details-marker { display: none; }
.sec summary::before { content: "▸"; color: var(--ink-3); font-size: 11px; transition: transform .12s; }
.sec[open] summary::before { transform: rotate(90deg); }
.sec summary .n { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.sec .body { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; max-width: 66ch; line-height: 1.65; }
.sec p { margin: 0; }
.alt { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: baseline; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.steps button { padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; }
.steps button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.arrive { animation: arrive .35s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .arrive { animation: none; } }

/* streaming stages */
.stages { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.stage { display: grid; grid-template-columns: 18px 130px 1fr; gap: 8px; align-items: baseline; color: var(--ink-3); }
.stage.done { color: var(--ink-2); } .stage.done .ic { color: var(--good); }
.stage.run { color: var(--ink); } .stage.run .ic { color: var(--warn); animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.stage .ic { font-weight: 700; }
.stage .what { font-weight: 600; }
.tools { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.tools span { padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); margin-right: 4px; display: inline-block; margin-top: 2px; }
.donebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--good-bg); font-size: 12px; color: var(--ink-2); }
.cursor::after { content: "▍"; color: var(--ink-3); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink-2); }
.chip.q { color: var(--ink); cursor: pointer; }
.chip.q:hover { border-color: var(--ink); }
.chip.q::before { content: "?"; font-weight: 700; color: var(--note); }
.turn { display: flex; flex-direction: column; gap: 6px; }
.bubble { padding: 8px 12px; border-radius: 10px; max-width: 62ch; line-height: 1.6; }
.bubble.user { align-self: flex-end; background: var(--ink); color: var(--paper); }
.bubble.tutor { background: var(--surface-2); }
.bubble.tutor .quote { display: block; border-left: 3px solid var(--note); padding-left: 8px; color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
.boardcard { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 62ch; }
.mini { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 3px; overflow: hidden; width: 64px; height: 64px; }
.mini span { display: flex; align-items: center; justify-content: center; font-size: 8px; line-height: 1; font-family: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', sans-serif; }
.mini span.l { background: var(--board-light); } .mini span.d { background: var(--board-dark); }
.mini span.w { color: #fffdf7; text-shadow: 0 0 1px #3a2f24, 0 0 1px #3a2f24; } .mini span.b { color: #2a221c; }
.ground { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.ask textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; min-height: 40px; }
.quotebtn { position: absolute; right: 0; top: -2px; }
.addendum { border-left: 3px solid var(--note); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
.addendum .q { font-weight: 600; }

/* deeper */
.lines { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.ev { font-family: var(--font-mono); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.ev i { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.ev i b { display: block; height: 100%; background: var(--good); }
table.masters { border-collapse: collapse; width: 100%; font-size: 13px; }
table.masters th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .04em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.masters td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.wdl { display: flex; height: 10px; border-radius: 5px; overflow: hidden; width: 160px; background: var(--line); }
.wdl i { display: block; height: 100%; } .wdl .w { background: #e9e2d3; } .wdl .dr { background: var(--line-strong); } .wdl .b { background: #5a4d42; }
pre.pgn { margin: 0; padding: 10px; border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; color: var(--ink-2); }

/* names */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp .col { display: flex; flex-direction: column; gap: 8px; }
.cmp .col > .cap { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.cand { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; align-items: start; }
.cand .mini { width: 56px; height: 56px; }
.cand .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jl { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); font-size: 13px; }
table.names { border-collapse: collapse; width: 100%; font-size: 13px; }
table.names td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
table.names td:first-child { color: var(--ink-2); }
@media (max-width: 900px) { .explore, .cmp { grid-template-columns: 1fr; } }
</style>

<div class="page">
  <div class="intro">
    <span><b>M8d 시안</b> · 해설 패널의 다음 단계 네 가지. 오른쪽 위 탭으로 상태를 바꿔 보세요. 숫자와 답변은 <b>예시</b>이고, 도구 호출·검증 표시 방식은 실제 채팅 화면과 같습니다.</span>
  </div>
  <div class="head">
    <div class="title">오프닝 지도 · 해설 패널</div>
    <span class="muted">4.Ba4 · 루이 로페즈: 모피 방어 · 흑 차례</span>
    <div class="grow"></div>
    <div class="tabs" id="tabs">
      <button type="button" class="tab on" data-tab="stream"><span class="n">1</span>노트 스트리밍</button>
      <button type="button" class="tab" data-tab="chat"><span class="n">2</span>튜터에게 질문</button>
      <button type="button" class="tab" data-tab="deep"><span class="n">3</span>더 깊이</button>
      <button type="button" class="tab" data-tab="names"><span class="n">4</span>한글 이름</button>
    </div>
  </div>

  <div class="card">
    <div class="explore">
      <div class="board-col">
        <div class="board-wrap"><div class="board" id="board"></div></div>
        <div class="board-line" id="posLine"></div>
        <div class="small faint">보드는 문맥용입니다. 함정·PV·튜터 보드의 수를 누르면 여기에 미리보기가 뜨고, 보드를 클릭하면 돌아옵니다.</div>
      </div>
      <div class="explain" id="panel"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function () {
  'use strict';
  const BASE_FEN = 'r1bqkbnr/1ppp1ppp/p1n5/4p3/B3P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 1 4';
  const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const FILES = 'abcdefgh';
  const state = { tab: 'stream', preview: null, addenda: [] };
  const mark = (s) => s.replace(/\[\[(.+?)\]\]/g, '<span class="v">$1</span>');
  const label = (ply, san) => (ply % 2 === 1 ? `${(ply + 1) / 2}.${san}` : `${ply / 2}…${san}`);
  const BASE_PLY = 8; // 4.Ba4 was ply 8; lines from here start at ply 9

  // ---------- board ----------
  function renderBoard() {
    const el = document.getElementById('board');
    const fen = state.preview ? state.preview.fen : BASE_FEN;
    const c = new Chess(fen);
    const last = state.preview ? state.preview.last : 'b5a4';
    el.innerHTML = '';
    const old = document.querySelector('.preview-chip'); if (old) old.remove();
    if (state.preview) el.parentElement.insertAdjacentHTML('afterbegin', `<span class="preview-chip">미리보기 · ${state.preview.title}</span>`);
    for (let r = 8; r >= 1; r--) for (const f of FILES) {
      const sq = f + r; const p = c.get(sq); const light = (FILES.indexOf(f) + r) % 2 === 1;
      const d = document.createElement('div');
      d.className = `sq ${light ? 'l' : 'd'}${last && (last.slice(0, 2) === sq || last.slice(2, 4) === sq) ? ' last' : ''}`;
      if (p) d.innerHTML = `<span class="p ${p.color}">${GLYPH[p.type]}</span>`;
      el.appendChild(d);
    }
    const pl = document.getElementById('posLine');
    pl.innerHTML = state.preview
      ? `<span class="badge neutral">미리보기</span><span class="mv">${state.preview.title}</span><button type="button" class="btn sm" id="pvBack">현재 국면으로</button>`
      : `<span class="mv">1.e4 e5 2.Nf3 Nc6 3.Bb5 a6 4.Ba4</span><span class="badge good">루이 로페즈: 모피 방어</span><span class="mono faint small">C70</span>`;
    const b = document.getElementById('pvBack'); if (b) b.onclick = () => { state.preview = null; renderBoard(); refreshSteps(); };
  }
  document.getElementById('board').addEventListener('click', () => { if (state.preview) { state.preview = null; renderBoard(); refreshSteps(); } });
  const PRE_FEN = 'r1bqkbnr/1ppp1ppp/p1n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 4';
  function previewLine(sans, n, title, key, base, ply0) {
    const c = new Chess(base || BASE_FEN); let last = null;
    for (let i = 0; i < n; i++) { const mv = c.move(sans[i]); if (!mv) break; last = mv.from + mv.to; }
    const p0 = ply0 ?? BASE_PLY;
    state.preview = { fen: c.fen(), last, title: `${title} · ${sans.slice(0, n).map((s, i) => label(p0 + i + 1, s)).join(' ')}`, key };
    renderBoard(); refreshSteps();
  }
  function stepButtons(sans, title, keyPrefix) {
    return `<div class="steps">${sans.map((s, i) => `<button type="button" data-line="${keyPrefix}" data-step="${i + 1}">${label(BASE_PLY + i + 1, s)}</button>`).join('')}</div>`;
  }
  const LINES = {};
  function wireSteps(root) {
    root.querySelectorAll('[data-line]').forEach((b) => b.addEventListener('click', () => {
      const L = LINES[b.dataset.line]; previewLine(L.sans, +b.dataset.step, L.title, `${b.dataset.line}:${b.dataset.step}`, L.base, L.ply0);
    }));
  }
  function refreshSteps() {
    document.querySelectorAll('[data-line]').forEach((b) => b.classList.toggle('on', !!state.preview && state.preview.key === `${b.dataset.line}:${b.dataset.step}`));
  }
  function miniBoard(sans, base) {
    const c = new Chess(base || BASE_FEN); for (const s of sans) c.move(s);
    let html = '<div class="mini">';
    for (let r = 8; r >= 1; r--) for (const f of FILES) { const p = c.get(f + r); const light = (FILES.indexOf(f) + r) % 2 === 1; html += `<span class="${light ? 'l' : 'd'}${p ? ' ' + p.color : ''}">${p ? GLYPH[p.type] : ''}</span>`; }
    return html + '</div>';
  }

  // ---------- shared note content (4.Ba4) ----------
  const NOTE = {
    summary: '압박을 유지하는 후퇴입니다. [[a4 비숍은 여전히 c6 나이트를 공격합니다.]] …b5에는 Bb3로 f7 대각선을 얻습니다.',
    why: ['Bxc6로 구조를 바꾸는 대신 긴 게임을 고릅니다. 비숍은 a4에서 c6를 계속 노리고, 백은 O-O, Re1, c3, d4로 중앙을 준비합니다. 흑이 …b5로 쫓으면 Bb3, …Na5로 바꾸려 하면 c3 뒤 Bc2로 물러날 자리를 미리 만듭니다.', '주의할 점은 딱 하나, d4를 너무 일찍 열지 않는 것입니다. 노아의 방주(아래)가 그 벌칙입니다.'],

      sec('마스터 통계 <span class="badge neutral">Lichess masters · 2200+ · 캐시</span>', '6가지', `<table class="masters"><thead><tr><th>수</th><th>판수</th><th>백승 · 무 · 흑승</th><th>평균 레이팅</th><th></th></tr></thead><tbody>${MASTERS.map(([s, g, w, d, b, r]) => `<tr><td class="mv">4…${s}</td><td class="mono">${g.toLocaleString()}</td><td><div style="display:flex;align-items:center;gap:8px"><span class="wdl"><i class="w" style="width:${w}%"></i><i class="dr" style="width:${d}%"></i><i class="b" style="width:${b}%"></i></span><span class="mono small">${w}·${d}·${b}</span></div></td><td class="mono">${r}</td><td><button type="button" class="btn sm">두기</button></td></tr>`).join('')}</tbody></table><p class="small faint">토큰이 없으면 이 섹션은 "마스터 DB 연결 없음(LICHESS_TOKEN)"으로 접힙니다.</p>`) +
      sec('일지 내보내기', '', `<pre class="pgn">[Event "chess-tutor opening study"]
[Opening "루이 로페즈: 모피 방어"] [ECO "C70"]

1. e4 {킹즈 폰 오프닝. e4 폰이 d5와 f5를 통제합니다.} e5 {오픈 게임.}
2. Nf3 {e5 폰을 공격하며 첫 기물을 전개합니다.} Nc6 {e5를 지킵니다.}
3. Bb5 {루이 로페즈. c6 나이트를 공격해 e5의 수비를 흔듭니다.} a6 {모피 방어.}
4. Ba4 {압박을 유지하는 후퇴입니다. a4 비숍은 여전히 c6 나이트를 공격합니다.} *</pre><div class="chips"><button type="button" class="btn sm">PGN 복사</button><button type="button" class="btn sm">여기서부터 두기 →</button></div>`, false) +
      `<div class="sources"><span>근거:</span><span class="badge neutral">엔진 깊이 12</span><span class="badge neutral">Lichess masters</span><span class="badge neutral">책 · lichess TSV</span></div>`;
    wireSteps(panel); refreshSteps();
  }

  // ---------- tab 4: Korean names ----------
  const NAMES = [
    ["Ruy Lopez: Morphy Defense", '루이 로페즈: 모피 방어', '고유명사 표'], ["King's Pawn Game", '킹즈 폰 게임', '규칙 사전'], ["Sicilian Defense: Najdorf Variation", '시실리안 디펜스: 나이도르프 변화', '고유명사 표 + 규칙'],
    ["Queen's Gambit Declined: Exchange Variation", '퀸즈 갬빗 디클라인드: 익스체인지 변화', '규칙 사전'], ["Ruy Lopez: Open, Bernstein Variation", '루이 로페즈: 오픈, 번스타인 변화', 'LLM 음차 · 검수됨'], ["Zukertort Opening: Double Fianchetto Attack", '주커토르트 오프닝: 더블 피안케토 어택', 'LLM 음차'],
    ["Caro-Kann Defense: Advance, Short Variation", '카로칸 디펜스: 어드밴스, 쇼트 변화', '고유명사 표'], ["Bird Opening: From's Gambit", '버드 오프닝: 프롬 갬빗', 'LLM 음차 · 검수됨'],
  ];
  function renderNames() {
    clearTimers();
    const card = (san, nameEn, nameKo, eco, mine, ko) => `<div class="cand">${miniBoard([san])}<div><div><span class="mv">4…${san}</span> <span class="mono faint small">${eco}</span></div><div class="name" title="${nameEn}">${ko ? nameKo : nameEn}</div><div class="small muted">${mine}</div></div></div>`;
    const rows = [['Nf6', 'Ruy Lopez: Morphy Defense', '루이 로페즈: 모피 방어', 'C78', '내 22판 55%'], ['d6', 'Ruy Lopez: Modern Steinitz Defense', '루이 로페즈: 모던 스타이니츠 방어', 'C71', '내 3판 33%'], ['b5', 'Ruy Lopez: Morphy Defense, Caro Variation', '루이 로페즈: 모피 방어, 카로 변화', 'C70', '내 1판']];
    const jl = (ko) => [['1.e4', "'King's Pawn Game'(B00) 국면이 됩니다. e4 폰이 d5와 f5를 통제합니다.", '킹즈 폰 게임(B00)이 됩니다. e4 폰이 d5와 f5를 통제합니다.'], ['3.Bb5', "'Ruy Lopez'(C60) 국면이 됩니다. c6 나이트를 공격합니다.", '루이 로페즈(C60)가 됩니다. c6 나이트를 공격합니다.'], ['4.Bc4', "책 밖의 수입니다. 책 수는 Bxc6('Ruy Lopez: Exchange Variation'), Ba4('Ruy Lopez: Open')입니다.", '책 밖의 수입니다. 책 수는 Bxc6(루이 로페즈: 익스체인지 변화), Ba4(루이 로페즈: 모피 방어)입니다.']].map(([l, en, k]) => `<div class="jl"><span class="mv">${l}</span><span>${ko ? k : en}</span></div>`).join('');
    panel.innerHTML = `<span class="req">4 · 한글 이름</span>` + header() +
      `<div class="cmp"><div class="col"><span class="cap">지금 (TSV 영어 이름)</span>${rows.map((r) => card(r[0], r[1], r[2], r[3], r[4], false)).join('')}${jl(false)}</div>` +
      `<div class="col"><span class="cap">M8d (assets/opening_names_ko.json)</span>${rows.map((r) => card(r[0], r[1], r[2], r[3], r[4], true)).join('')}${jl(true)}</div></div>` +
      sec('번역 출처 <span class="badge neutral">3,810개 · 규칙 사전 60단어 + 고유명사 200개 + LLM 음차 · 상위 200개 검수</span>', '', `<table class="names">${NAMES.map(([en, ko, src]) => `<tr><td>${en}</td><td>${ko}</td><td><span class="badge ${src.includes('검수') ? 'good' : 'neutral'}">${src}</span></td></tr>`).join('')}</table><p class="small faint">영어 이름은 카드의 <code>title</code>(마우스 올림)로 항상 확인할 수 있습니다. 카탈로그의 <code>name_en</code>은 그대로 둡니다.</p>`);
  }

  // ---------- tabs ----------
  const RENDER = { stream: renderStream, chat: renderChat, deep: renderDeep, names: renderNames };
  document.querySelectorAll('#tabs .tab').forEach((b) => b.addEventListener('click', () => {
    state.tab = b.dataset.tab; state.preview = null;
    document.querySelectorAll('#tabs .tab').forEach((x) => x.classList.toggle('on', x === b));
    renderBoard(); RENDER[state.tab]();
  }));
  renderBoard(); renderStream();
  later(400, runStream);
})();
</script>
